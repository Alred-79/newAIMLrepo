[project]
name = "clineq-ai-engine"
version = "0.1.0"
description = "ClinEQ AI Simulation & Evaluation Engine"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.30.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["ai-engine"]
include = ["shared*", "bias_eval*", "patient_sim*"]
