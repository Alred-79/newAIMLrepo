<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinEQ MVP1 — Patient Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: #1a1f36;
    color: white;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .scenario-info {
    font-size: 13px;
    color: #a0aec0;
  }

  /* Scenario selector */
  .scenario-select-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px;
  }
  .scenario-select-screen h2 {
    font-size: 24px;
    color: #1a1f36;
  }
  .scenario-select-screen p {
    color: #718096;
    max-width: 500px;
    text-align: center;
    line-height: 1.5;
  }
  .scenario-cards {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
  }
  .scenario-card {
    background: white;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    width: 220px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .scenario-card:hover {
    border-color: #3182ce;
    box-shadow: 0 4px 12px rgba(49,130,206,0.15);
    transform: translateY(-2px);
  }
  .scenario-card.control { border-left: 4px solid #38a169; }
  .scenario-card.experimental { border-left: 4px solid #e53e3e; }
  .scenario-card .card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .scenario-card .card-category {
    font-size: 12px;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .scenario-card .card-nodes {
    font-size: 12px;
    color: #a0aec0;
    margin-top: 8px;
  }
  .scenario-card.locked {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }
  .scenario-card.locked::after {
    content: "Complete control first";
    display: block;
    font-size: 11px;
    color: #e53e3e;
    margin-top: 8px;
    font-style: italic;
  }

  /* Chat area */
  .chat-container {
    flex: 1;
    display: none;
    flex-direction: column;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    background: white;
    border-left: 1px solid #e2e8f0;
    border-right: 1px solid #e2e8f0;
  }
  .chat-container.active { display: flex; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Message bubbles */
  .message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease-in;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.student {
    background: #3182ce;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .message.patient {
    background: #edf2f7;
    color: #2d3748;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .message.patient em, .message.patient i {
    color: #718096;
    font-style: italic;
  }
  .message.system {
    background: #fefcbf;
    color: #744210;
    align-self: center;
    border-radius: 8px;
    font-size: 13px;
    padding: 8px 16px;
    max-width: 90%;
    text-align: center;
    border: 1px solid #f6e05e;
  }

  .message-label {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .message.student .message-label { color: rgba(255,255,255,0.7); }
  .message.patient .message-label { color: #a0aec0; }
  .message.system .message-label { color: #b7791f; }

  /* Input area */
  .input-area {
    padding: 12px 20px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    gap: 8px;
    background: white;
    flex-shrink: 0;
  }
  .input-area input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area input:focus { border-color: #3182ce; }
  .input-area input:disabled { background: #f7fafc; color: #a0aec0; }

  .input-area button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-send {
    background: #3182ce;
    color: white;
  }
  .btn-send:hover { background: #2b6cb0; }
  .btn-send:disabled { background: #a0aec0; cursor: not-allowed; }

  .btn-end {
    background: #fed7d7;
    color: #c53030;
  }
  .btn-end:hover { background: #feb2b2; }

  /* Summary panel */
  .summary-panel {
    display: none;
    padding: 20px;
    background: #f7fafc;
    border-top: 2px solid #e2e8f0;
  }
  .summary-panel.active { display: block; }
  .summary-panel h3 { font-size: 16px; margin-bottom: 12px; color: #1a1f36; }
  .summary-stat {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
    border-bottom: 1px solid #edf2f7;
  }
  .summary-stat .label { color: #718096; }
  .summary-stat .value { font-weight: 600; color: #2d3748; }
  .btn-back {
    margin-top: 16px;
    padding: 10px 20px;
    background: #1a1f36;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-back:hover { background: #2d3748; }

  /* Loading dots */
  .typing-indicator {
    display: none;
    align-self: flex-start;
    padding: 12px 16px;
    background: #edf2f7;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing-indicator.active { display: flex; gap: 4px; }
  .typing-indicator span {
    width: 7px; height: 7px;
    background: #a0aec0;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>ClinEQ MVP1</h1>
  <span class="scenario-info" id="scenarioInfo"></span>
</div>

<!-- Scenario selection -->
<div class="scenario-select-screen" id="selectScreen">
  <h2>Select a Scenario</h2>
  <p>You will role-play as a medical student conducting a clinical interview.
     The control scenario must be completed first.</p>
  <div class="scenario-cards" id="scenarioCards">
    <p style="color:#a0aec0">Loading scenarios...</p>
  </div>
</div>

<!-- Chat interface -->
<div class="chat-container" id="chatContainer">
  <div class="messages" id="messages">
    <div class="typing-indicator" id="typingIndicator">
      <span></span><span></span><span></span>
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type your message..."
           autocomplete="off" />
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
    <button class="btn-end" id="endBtn" onclick="endEncounter()">End</button>
  </div>
  <div class="summary-panel" id="summaryPanel">
    <h3>Encounter Summary</h3>
    <div id="summaryStats"></div>
    <button class="btn-back" onclick="backToSelect()">Back to Scenarios</button>
  </div>
</div>

<script>
let ws = null;
let controlCompleted = false;

async function loadScenarios() {
  try {
    const res = await fetch('/api/scenarios');
    const data = await res.json();
    renderScenarioCards(data.scenarios);
  } catch (e) {
    document.getElementById('scenarioCards').innerHTML =
      '<p style="color:#e53e3e">Failed to load scenarios. Is the server running?</p>';
  }
}

function renderScenarioCards(scenarios) {
  const container = document.getElementById('scenarioCards');
  container.innerHTML = '';

  scenarios.forEach(s => {
    const isControl = s.category === 'control';
    const isLocked = !isControl && !controlCompleted;

    const card = document.createElement('div');
    card.className = `scenario-card ${isControl ? 'control' : 'experimental'} ${isLocked ? 'locked' : ''}`;
    card.innerHTML = `
      <div class="card-category">${s.category.replace('_', ' ')}</div>
      <div class="card-title">${s.title}</div>
      <div class="card-nodes">${s.node_count} content nodes</div>
    `;

    if (!isLocked) {
      card.onclick = () => startScenario(s.scenario_id, s.title);
    }

    container.appendChild(card);
  });
}

function startScenario(scenarioId, title) {
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('chatContainer').classList.add('active');
  document.getElementById('scenarioInfo').textContent = title;
  document.getElementById('messages').innerHTML =
    '<div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>';
  document.getElementById('summaryPanel').classList.remove('active');
  document.getElementById('messageInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;

  // Connect WebSocket
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws/chat/${scenarioId}`);

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    hideTyping();

    if (data.type === 'messages') {
      data.messages.forEach(msg => addMessage(msg.role, msg.content));
    }
    else if (data.type === 'encounter_ended') {
      data.messages.forEach(msg => addMessage(msg.role, msg.content));
      showSummary(data.summary);
      // Check if this was the control scenario
      if (data.summary && !controlCompleted) {
        controlCompleted = true;
      }
    }
    else if (data.type === 'error') {
      addMessage('system', `Error: ${data.message}`);
    }
  };

  ws.onerror = () => addMessage('system', 'Connection error. Please refresh.');
  ws.onclose = () => {};

  document.getElementById('messageInput').focus();
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  // Don't render student message here — the server includes it in the response
  ws.send(JSON.stringify({ type: 'message', content: text }));
  input.value = '';
  showTyping();
  input.focus();
}

function endEncounter() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'end_encounter' }));
  }
}

function addMessage(role, content) {
  const container = document.getElementById('messages');
  const indicator = document.getElementById('typingIndicator');

  const div = document.createElement('div');
  div.className = `message ${role}`;

  const labels = { student: 'You', patient: 'Patient', system: 'System' };

  // Render stage directions (text between asterisks) as italic
  let rendered = content.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  div.innerHTML = `
    <div class="message-label">${labels[role] || role}</div>
    <div>${rendered}</div>
  `;

  container.insertBefore(div, indicator);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  document.getElementById('typingIndicator').classList.add('active');
  const container = document.getElementById('messages');
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  document.getElementById('typingIndicator').classList.remove('active');
}

function showSummary(summary) {
  document.getElementById('messageInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;

  const panel = document.getElementById('summaryPanel');
  const stats = document.getElementById('summaryStats');

  const items = [
    ['Exchanges', summary.exchange_count || 0],
    ['Nodes Delivered', `${summary.total_nodes_delivered || 0} / ${summary.total_nodes_available || 0}`],
  ];

  if (summary.undelivered_essential_nodes && summary.undelivered_essential_nodes.length > 0) {
    items.push(['Undelivered Essential', summary.undelivered_essential_nodes.join(', ')]);
  }

  stats.innerHTML = items.map(([label, value]) =>
    `<div class="summary-stat"><span class="label">${label}</span><span class="value">${value}</span></div>`
  ).join('');

  panel.classList.add('active');
}

function backToSelect() {
  if (ws) ws.close();
  document.getElementById('chatContainer').classList.remove('active');
  document.getElementById('selectScreen').style.display = 'flex';
  loadScenarios();  // refresh to show unlocked scenarios
}

document.getElementById('messageInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadScenarios();
</script>
</body>
</html>
