name: CI

on:
  push:    {}
  pull_request: {}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -e './ai-engine[dev]'

      - name: Run tests
        run: python -m pytest ai-engine/tests/ -q
